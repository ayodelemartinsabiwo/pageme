<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b09">
  <meta name="description" content="Send an urgent page to someone currently focusing with PageMe.">
  <meta name="robots" content="noindex,nofollow">
  <title>Page someone on PageMe</title>
  <link rel="icon" href="assets/images/pageme-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=status-1">
  <link rel="stylesheet" href="page.css?v=status-1">
  <link rel="stylesheet" href="refresh.css">
</head>
<body class="status-body">
  <a class="skip-link" href="#status-main">Skip to status</a>
  <header class="site-header scrolled status-header">
    <a class="brand" href="index.html"><img src="assets/images/pageme-mark.png" alt="" width="36" height="36"><span>PAGE.ME</span></a>
    <a class="text-link" href="guide.html#ucn-pages/send-to-ucn">How pages work <span aria-hidden="true">-&gt;</span></a>
  </header>

  <main class="status-main" id="status-main">
    <section class="status-pager" aria-labelledby="status-title">
      <div class="status-pager-top"><span>PAGE.ME</span><i aria-hidden="true"></i></div>
      <div class="status-lcd" data-status-view aria-live="polite" aria-busy="true">
        <p class="status-signal">INCOMING STATUS</p>
        <h1 id="status-title">Checking status…</h1>
        <p class="status-copy" data-status-copy>Opening this private link.</p>
        <p class="status-time" data-status-time hidden></p>
        <div class="status-actions" data-status-actions hidden>
          <a class="status-primary" data-open-app href="#">Open PageMe</a>
          <a class="play-badge-link" data-download-link aria-label="Get PageMe on Google Play">
            <img src="assets/images/google-play-badge.png" alt="Get it on Google Play" width="646" height="250">
          </a>
        </div>
        <button class="status-retry" type="button" data-status-retry hidden>Try again</button>
        <p class="status-privacy">Names and contact details stay private.</p>
      </div>
      <p class="status-note"></p>
    </section>
  </main>

  <footer class="site-footer status-footer"><a class="brand footer-brand" href="index.html"><img src="assets/images/pageme-mark.png" alt="" width="30" height="30"><span>PAGE.ME</span></a><p>Focus without disappearing.</p><div><a href="guide.html">Guide</a><a href="privacy.html">Privacy</a></div><p class="copyright">Copyright <span data-year></span> PageMe.</p></footer>
  <script src="site-config.js?v=status-1"></script>
  <script src="app.js?v=status-1" defer></script>
  <script src="page.js?v=status-1" defer></script>
</body>
</html>
