apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv('PAGEME_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('PAGEME_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('PAGEME_KEY_ALIAS')
def releaseKeyPassword = System.getenv('PAGEME_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.pageme.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pageme.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 33
        versionName "1.3.20"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// Firebase's current DataStore dependency is multiplatform. This Java-only
// Android module otherwise resolves its generic coordinates to JVM artifacts,
// which omit Android's PreferenceDataStoreDelegateKt implementation.
configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute module('androidx.datastore:datastore-preferences') using module('androidx.datastore:datastore-preferences-android:1.1.7')
        substitute module('androidx.datastore:datastore') using module('androidx.datastore:datastore-android:1.1.7')
        substitute module('androidx.datastore:datastore-core') using module('androidx.datastore:datastore-core-android:1.1.7')
        substitute module('androidx.datastore:datastore-preferences-core') using module('androidx.datastore:datastore-preferences-core-android:1.1.7')
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-messaging'
    // Firebase Installations uses DataStore's Android-only delegate at runtime.
    // Declaring the target explicitly prevents Gradle from selecting the JVM variant.
    implementation 'androidx.datastore:datastore-preferences-android:1.1.7'
    implementation 'androidx.work:work-runtime:2.10.5'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
