name: Deploy PageMe website

on:
  push:
    branches: [main]
    paths:
      - "pageme-site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare verified beta download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pageme-site-dist/downloads
          cp -R pageme-site/. pageme-site-dist/
          gh release download v1.3.11-beta.1 \
            --repo "${{ github.repository }}" \
            --pattern PageMe-Android.apk \
            --dir pageme-site-dist/downloads
          echo "e1f948121c24a8d11e3413aa380cdecfece6966c9c4841fbb63ad3974b449716  pageme-site-dist/downloads/PageMe-Android.apk" | sha256sum --check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pageme-site-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
